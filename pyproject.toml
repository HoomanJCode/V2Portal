[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2portal"
version = "0.2.2"
description = "Cross-platform V2Ray CLI proxy client for sing-box and Xray-core with subscriptions, proxy groups, split routing, and LAN servers"
readme = "README.md"
keywords = [
    "v2ray",
    "v2ray-cli",
    "xray",
    "xray-core",
    "sing-box",
    "proxy-client",
    "proxy-manager",
    "proxy-subscription",
    "split-routing",
    "split-tunneling",
    "socks5",
    "wireguard",
]
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "httpx[socks]>=0.26",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
v2portal = "v2portal.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
