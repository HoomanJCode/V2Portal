[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2portal"
version = "0.1.1"
description = "Interactive v2ray CLI client (sing-box + xray-core) with subscriptions, groups, and split routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "httpx[socks]>=0.26",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
v2portal = "v2portal.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
